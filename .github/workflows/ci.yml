name: Retail-OS CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow/branch to optimize CI runner utilization
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Build, Migrations & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: retail_saas
          MYSQL_USER: retailuser
          MYSQL_PASSWORD: retailpassword
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      APP_ENV: testing
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-key-for-github-actions-retail-os-pipeline
      DATABASE_URL: mysql+pymysql://retailuser:retailpassword@127.0.0.1:3306/retail_saas
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      AUTH_FIXED_OTP_ENABLED: "false"
      PYTHONPATH: ${{ github.workspace }}/retail-saas:${{ github.workspace }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: retail-saas/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            pkg-config \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-dejavu-core

      - name: Upgrade pip and Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r retail-saas/requirements.txt

      - name: Verify Service Health (MySQL 8 & Redis)
        run: |
          python - << 'EOF'
          import time, sys, pymysql, redis

          print("Verifying MySQL 8 service connection...")
          for attempt in range(1, 31):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="retailuser",
                      password="retailpassword",
                      database="retail_saas",
                      charset="utf8mb4"
                  )
                  conn.close()
                  print(f"MySQL 8 is ready and accepting connections (attempt {attempt}).")
                  break
              except Exception as err:
                  print(f"Waiting for MySQL (attempt {attempt}/30): {err}")
                  time.sleep(2)
          else:
              print("ERROR: Timed out waiting for MySQL service to become available.", file=sys.stderr)
              sys.exit(1)

          print("Verifying Redis service connection...")
          try:
              r = redis.Redis(host="127.0.0.1", port=6379, db=0)
              assert r.ping() is True
              print("Redis service is ready and responding to PING.")
          except Exception as err:
              print(f"ERROR: Redis connection failed: {err}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Code Syntax & Build Compilation Check
        run: |
          echo "Compiling Python source code across app and tests..."
          python -m compileall -q retail-saas/app retail-saas/tests
          echo "Validating core application boot and dependency resolution..."
          python -c "import app.main; print('FastAPI application initialized successfully')"

      - name: Apply Alembic Database Migrations
        run: |
          echo "Applying all database migrations against live MySQL 8..."
          cd retail-saas
          alembic upgrade head
          echo "Verified Alembic current migration head:"
          alembic current

      - name: Run Automated Test Suite
        run: |
          cd retail-saas
          pytest -v --tb=short

